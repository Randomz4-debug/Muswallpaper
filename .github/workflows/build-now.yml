name: Build APK Now
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-now.yml'
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Fix remaining lyrics reference
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/muswall/app/service/MediaNotificationListenerService.kt')
          s=p.read_text()
          s=s.replace('loadLyrics(it, force = true)', 'handleMetadata(it, true)')
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/muswall/app/service/MediaNotificationListenerService.kt
          if ! git diff --cached --quiet; then git commit -m 'Fix remaining lyrics reference'; git push; fi
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.4
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.4'
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MusWall-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Remove one-time workflow
        if: success()
        run: |
          git rm .github/workflows/build-now.yml
          git commit -m 'Remove one-time APK build workflow'
          git push