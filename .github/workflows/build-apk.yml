name: Build SoundWall APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply source fixes
        run: python3 tools/fix_build_and_lyrics.py

      - name: Apply sync, highlight and glass widget fixes
        run: python3 tools/fix_sync_glass_performance.py

      - name: Apply POCO lock, restore and performance fixes
        run: python3 tools/fix_poco_lock_and_performance.py

      - name: Apply black-screen restore fix
        run: python3 tools/fix_black_restore_and_live_setup.py

      - name: Apply current-track music photo fix
        run: python3 tools/fix_current_track_artwork.py
      - name: Commit source fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/muswall/app/ui/SettingsActivity.kt app/src/main/java/com/muswall/app/service/MediaNotificationListenerService.kt app/src/main/java/com/muswall/app/service/UniversalLyricsReceiver.kt app/src/main/java/com/muswall/app/wallpaper/MusicWallpaperService.kt app/src/main/java/com/muswall/app/wallpaper/WallpaperHelper.kt app/src/main/java/com/muswall/app/widget/MusicWidgetProvider.kt app/src/main/res/layout/widget_music.xml app/src/main/java/com/muswall/app/data/PreferencesManager.kt tools/fix_sync_glass_performance.py tools/fix_poco_lock_and_performance.py tools/fix_music_live_architecture.py tools/fix_spotify_lyrics_overlay.py tools/fix_black_restore_and_live_setup.py tools/fix_current_track_artwork.py
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "Use current track artwork for music wallpaper"
            git push
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.4
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.4'
          cache-provider: basic

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SoundWall-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
